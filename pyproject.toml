[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "hinode"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "A Python library to download and analyze observations from the Hinode satellite."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests",
    "urllib3>=2",
    "joblib",
    "astropy",
    "scipy",
    "named-arrays~=2.14",
    "xrtpy~=0.5.1",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
]
doc = [
    "pytest",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "sphinx-favicon",
]

[project.urls]
Homepage = "https://github.com/sun-data/hinode"
Documentation = "https://hinode.readthedocs.io/en/latest"

[tool.setuptools.package-data]
hinode = ["py.typed"]

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["hinode"]
# The tests are excluded because `astropy` does not ship a `py.typed` marker,
# so expressions such as `numpy.linspace(...) * astropy.units.arcsec`,
# which the tests use heavily, are not inferred as a `Quantity`.
exclude = ["**/*_test.py", "**/__pycache__"]
typeCheckingMode = "standard"
